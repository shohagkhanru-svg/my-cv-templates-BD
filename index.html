<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Solution BD - Auto Gallery</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{background:#f4f8ff}
nav{background:#0f172a;color:#fff;padding:16px 24px;font-size:28px;font-weight:bold}
.hero{padding:80px 20px;text-align:center;color:#fff;background:linear-gradient(135deg,#1e3a8a,#2563eb,#06b6d4)}
.gallery{max-width:1300px;margin:30px auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:25px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.12)}
.card img{width:100%;height:320px;object-fit:cover}
.card a{display:block;padding:12px;text-align:center;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<nav>Career Solution BD</nav>
<section class="hero">
<h1>CV Design Collection</h1>
<p>Automatically loads cv1.png to cv50.png if available</p>
</section>

<div class="gallery" id="gallery"></div>

<script>
const gallery=document.getElementById('gallery');
for(let i=1;i<=50;i++){
  const img=`cv${i}.png`;
  const card=document.createElement('div');
  card.className='card';
  card.innerHTML=`
    <img src="${img}" onerror="this.parentElement.remove()">
    <a href="${img}" target="_blank">View CV ${i}</a>`;
  gallery.appendChild(card);
}
</script>
</body>
</html>
